<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verifikasi ArcZ Community</title>
<meta name="theme-color" content="#070b18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../site.css">
<style>
.auth-callback{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-callback-content{width:min(460px,100%);text-align:center}
.auth-callback-mark{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 18px;border-radius:16px;background:linear-gradient(145deg,#37d99a,#35d6ff);color:#07131a;font:700 15px var(--display)}
.auth-callback h1{font-size:25px;margin-bottom:10px}
.auth-callback p{color:var(--dim);font-size:14px;line-height:1.6}
.auth-callback-status{min-height:22px;color:var(--faint)}
.auth-callback-link{display:inline-flex;margin-top:12px}
</style>
</head>
<body>
<main class="auth-callback">
  <section class="auth-callback-content" aria-labelledby="callbackTitle">
    <span class="auth-callback-mark" aria-hidden="true">AC</span>
    <h1 id="callbackTitle">Memverifikasi akun Community</h1>
    <p class="auth-callback-status" id="callbackStatus" role="status" aria-live="polite">Memeriksa tautan verifikasi...</p>
    <a class="btn auth-callback-link" id="communityLink" href="../community/" hidden>Buka ArcZ Community</a>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  var SUPA_URL="https://beqlxnlhvarjhkuxndmr.supabase.co";
    var SUPA_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJlcWx4bmxodmFyamhrdXhuZG1yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMjQ4ODgsImV4cCI6MjEwNjcwMDg4OH0.FxPj-dfPf6OnfPotgQxFafd7Fx9yIM6oqMm25xMRslw";
  var status=document.getElementById("callbackStatus"),link=document.getElementById("communityLink"),params=new URLSearchParams(location.search);
  function fail(message){status.textContent=message;link.hidden=false}
  if(params.get("tokenrahasia")!=="true"){fail("Tautan verifikasi tidak valid atau sudah kedaluwarsa.");return}
  if(!window.supabase||!window.supabase.createClient){fail("Layanan verifikasi belum termuat. Muat ulang halaman untuk mencoba lagi.");return}
  var client=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"arcz-community-auth"}});
  client.auth.getSession().then(function(result){
    if(result.error)throw result.error;
    if(result.data.session&&result.data.session.user&&!result.data.session.user.is_anonymous){
      status.textContent="Verifikasi berhasil. Membuka ArcZ Community...";
      window.location.replace("../community/");
    }else fail("Sesi verifikasi tidak ditemukan. Buka kembali tautan terbaru dari email Anda.");
  }).catch(function(){fail("Tautan verifikasi gagal diproses. Buka kembali tautan terbaru dari email Anda.")});
})();
</script>
</body>
</html>
