<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f4f6ff;
  --ink-dim:rgba(244,246,255,.68);
  --ink-faint:rgba(244,246,255,.42);
  --glass:rgba(255,255,255,.07);
  --glass-strong:rgba(255,255,255,.12);
  --glass-edge:rgba(255,255,255,.18);
  --glass-hi:rgba(255,255,255,.34);
  --accent:#8f7bff;
  --accent-2:#35d6ff;
  --danger:#ff7a8a;
  --bg:#080b18;
  --radius:22px;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--bg);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
/* latar: orb berwarna yang diburamkan oleh panel kaca */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.o1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle at 30% 30%,#7b5cff,#3a2bd6 60%,transparent 72%)}
.o2{width:40vmax;height:40vmax;right:-10vmax;top:12vh;background:radial-gradient(circle at 60% 40%,#27d3ff,#1565d8 58%,transparent 72%)}
.o3{width:34vmax;height:34vmax;left:22vw;bottom:-18vmax;background:radial-gradient(circle at 50% 50%,#ff5fc8,#a1219b 55%,transparent 72%)}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@media (prefers-reduced-motion:no-preference){
  .o1{animation:drift1 38s ease-in-out infinite alternate}
  .o2{animation:drift2 46s ease-in-out infinite alternate}
  .o3{animation:drift3 42s ease-in-out infinite alternate}
}
@keyframes drift1{to{transform:translate(8vmax,6vmax)}}
@keyframes drift2{to{transform:translate(-9vmax,5vmax)}}
@keyframes drift3{to{transform:translate(7vmax,-6vmax)}}

.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
  border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  backdrop-filter:blur(26px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.05),0 24px 60px -20px rgba(0,0,0,.55);
}

.app{
  position:relative;z-index:1;height:100%;display:grid;grid-template-columns:292px 1fr;gap:14px;
  padding:14px;padding-top:max(14px,env(safe-area-inset-top));padding-bottom:max(14px,env(safe-area-inset-bottom));
}
/* sidebar */
.side{border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;padding:14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px -4px rgba(95,110,255,.7)}
.logo svg{width:18px;height:18px}
.brand b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.btn{
  font:inherit;color:var(--ink);cursor:pointer;border:1px solid var(--glass-edge);
  background:var(--glass-strong);border-radius:14px;padding:10px 14px;font-weight:550;font-size:14px;
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.icon:focus-visible,.chip:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.btn.primary{background:linear-gradient(135deg,rgba(143,123,255,.85),rgba(53,214,255,.7));border-color:rgba(255,255,255,.35)}
.btn.primary:hover{filter:brightness(1.1)}
.new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.hist{flex:1;min-height:0;overflow-y:auto;margin:14px -6px 10px;padding:0 6px;display:flex;flex-direction:column;gap:3px}
.hist-label{font-size:12.5px;color:var(--ink-faint);padding:0 8px 6px}
.item{display:flex;align-items:center;gap:6px;border-radius:12px;padding:9px 10px;cursor:pointer;color:var(--ink-dim);font-size:14px;border:1px solid transparent}
.item:hover{background:var(--glass)}
.item.on{background:var(--glass-strong);border-color:var(--glass-edge);color:var(--ink)}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{opacity:0;border:0;background:none;color:var(--ink-dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px;border-radius:6px}
.item:hover .x,.item .x:focus-visible{opacity:1}
.item .x:hover{color:var(--danger);background:rgba(255,255,255,.1)}
.qcard{margin-bottom:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.qrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-dim)}
.qrow .tool{padding:2px 8px}
.qval{font-size:22px;font-weight:650;letter-spacing:-.02em;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.qval small{font-size:13px;font-weight:500;color:var(--ink-dim);margin-left:4px;letter-spacing:0}
.qbar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.qbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s ease}
.qbar i.low{background:linear-gradient(90deg,#ff9a5c,var(--danger))}
.qsub{font-size:12px;color:var(--ink-faint);margin-top:8px;line-height:1.4;word-break:break-word}
.qcard{margin-bottom:10px;padding:12px 14px;border-radius:16px;background:rgba(8,11,24,.34);border:1px solid rgba(255,255,255,.14)}
.qhead{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--ink-dim);margin-bottom:6px}
.qhead button{border:0;background:none;color:var(--ink-dim);cursor:pointer;width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.qhead button:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.qhead button:focus-visible{outline:2px solid var(--accent-2)}
.qhead svg{width:15px;height:15px}
.qhead button.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.qhead button.spin svg{animation:none;opacity:.5}}
.qval{font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.qval small{font-size:12.5px;font-weight:500;color:var(--ink-dim);letter-spacing:0;margin-left:4px}
.qbar{height:6px;border-radius:99px;background:rgba(255,255,255,.12);margin-top:10px;overflow:hidden;display:none}
.qbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.qbar.low i{background:linear-gradient(90deg,#ff7a8a,#ffb36b)}
.qsub{font-size:12px;color:var(--ink-faint);margin-top:7px;line-height:1.4;word-break:break-word}
.side-foot{display:flex;gap:8px;flex-wrap:wrap}
.side-foot #adminBtn{flex-basis:100%}
.side-foot .btn{flex:1;font-size:13.5px;padding:9px 10px}

/* kartu sisa token */
.qcard{margin-bottom:10px;padding:13px 14px 12px;border-radius:16px;background:rgba(8,11,24,.32);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.q-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-dim)}
.q-refresh{width:28px;height:28px;border-radius:9px;border:0;background:none;color:var(--ink-dim);cursor:pointer;display:grid;place-items:center}
.q-refresh:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.q-refresh:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
.q-refresh svg{width:15px;height:15px}
.q-refresh.spin svg{animation:qspin .8s linear infinite}
@keyframes qspin{to{transform:rotate(360deg)}}
.q-num{font-size:25px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.q-num small{font-size:13px;color:var(--ink-dim);font-weight:500;margin-left:5px;letter-spacing:0}
.q-bar{height:11px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px 0 9px;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.q-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 14px rgba(53,214,255,.55),inset 0 1px 0 rgba(255,255,255,.45);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.qcard.low .q-fill{background:linear-gradient(90deg,#ffa63d,#ffd76a);box-shadow:0 0 14px rgba(255,190,80,.5),inset 0 1px 0 rgba(255,255,255,.45)}
.qcard.crit .q-fill{background:linear-gradient(90deg,#ff4d63,#ff8a7a);box-shadow:0 0 14px rgba(255,90,110,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.qcard.unk .q-fill{opacity:.4}
.q-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.q-meta .bad{color:var(--danger)}
@media (prefers-reduced-motion:reduce){.q-fill{transition:none}.q-refresh.spin svg{animation:none}}

/* utama */
.main{border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.icon{border:1px solid var(--glass-edge);background:var(--glass);color:var(--ink);width:38px;height:38px;border-radius:12px;cursor:pointer;display:grid;place-items:center;flex:none}
.icon:hover{background:var(--glass-strong)}
.icon svg{width:18px;height:18px}
.menu-btn{display:none}
.title{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
select{
  font:inherit;font-size:13.5px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-edge);
  border-radius:12px;padding:9px 12px;max-width:190px;cursor:pointer;
}
select option{background:#14172b;color:var(--ink)}
.top{position:relative;z-index:30}
.dd{position:relative;flex:none}
.dd-btn{display:flex;align-items:center;gap:8px;font:inherit;font-size:13.5px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-edge);border-radius:12px;padding:9px 12px;cursor:pointer;max-width:200px}
.dd-btn:hover{background:rgba(255,255,255,.22)}
.dd-btn:focus-visible,.dd-item:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
.dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn svg{width:14px;height:14px;flex:none;transition:transform .2s}
.dd-btn[aria-expanded=true] svg{transform:rotate(180deg)}
.dd-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;max-height:min(60vh,380px);overflow-y:auto;padding:6px;border-radius:16px;background:linear-gradient(145deg,rgba(40,44,80,.96),rgba(22,25,50,.97));border:1px solid var(--glass-edge);box-shadow:0 18px 44px rgba(0,0,0,.45);animation:ddIn .16s ease}
.dd-menu[hidden]{display:none}
.dd-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;font:inherit;font-size:13.5px;color:var(--ink);background:none;border:0;border-radius:10px;padding:9px 12px;cursor:pointer}
.dd-item:hover{background:rgba(255,255,255,.12)}
.dd-item.on{background:rgba(255,255,255,.18);font-weight:600}
.dd-item.on::after{content:"✓";color:var(--accent-2)}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dd-menu{animation:none}.dd-btn svg{transition:none}}
.feed{flex:1;min-height:0;overflow-y:auto;padding:22px 18px 10px;scroll-behavior:smooth}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:100%}
.msg.user{align-items:flex-end}
.bubble{
  padding:12px 16px;border-radius:18px;line-height:1.6;font-size:15.5px;max-width:100%;overflow-wrap:anywhere;
}
.user .bubble{
  background:linear-gradient(135deg,rgba(143,123,255,.55),rgba(53,214,255,.38));
  border:1px solid rgba(255,255,255,.3);border-bottom-right-radius:6px;white-space:pre-wrap;max-width:88%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
}
.bot .bubble{background:var(--glass);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:6px;width:100%}
.bubble.err{border-color:rgba(255,122,138,.5);color:#ffd5da}
.tools{display:flex;gap:6px;padding-left:4px}
.tool{font:inherit;font-size:12.5px;color:var(--ink-faint);background:none;border:0;cursor:pointer;padding:4px 8px;border-radius:8px}
.tool:hover{color:var(--ink);background:var(--glass)}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);animation:bl 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}.feed{scroll-behavior:auto}}

/* markdown */
.bubble p{margin:0 0 .75em}.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:1em 0 .45em;line-height:1.3;letter-spacing:-.01em}
.bubble h1{font-size:1.35em}.bubble h2{font-size:1.2em}.bubble h3{font-size:1.07em}.bubble h4{font-size:1em}
.bubble ul,.bubble ol{margin:0 0 .75em 1.3em}.bubble li{margin:.2em 0}
.bubble a{color:var(--accent-2)}
.bubble code{font-family:var(--mono);font-size:.88em;background:rgba(255,255,255,.12);padding:.12em .4em;border-radius:6px}
.code{margin:.4em 0 .9em;border-radius:14px;overflow:hidden;background:rgba(6,8,20,.55);border:1px solid rgba(255,255,255,.14)}
.code-head{display:flex;justify-content:flex-start;align-items:center;gap:2px;padding:6px 8px 6px 14px;background:rgba(255,255,255,.07);font-size:12.5px;color:var(--ink-dim)}
.code-head button{font:inherit;font-size:12.5px;color:var(--ink-dim);background:none;border:0;cursor:pointer;padding:4px 9px;border-radius:8px}
.code-head button:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.code-head span{margin-right:8px;font-family:var(--mono);text-transform:lowercase}
.code-head button[data-run]{color:var(--accent-2)}
.code-run{border-top:1px solid rgba(255,255,255,.14);background:#fff}
.code-run iframe{display:block;width:100%;height:320px;border:0;background:#fff}
.code pre{overflow-x:auto;padding:12px 14px}
.login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,6,16,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.login.show{display:flex}
.login form{width:min(340px,100%);padding:24px;border-radius:22px}
.login h2{margin:0 0 4px;font-size:20px}
.login p{margin:0 0 16px;color:var(--ink-dim);font-size:13.5px}
.login .err{color:var(--danger);font-size:13px;min-height:18px;margin:2px 0 10px}
.login .btn{width:100%}
.code pre code{background:none;padding:0;font-size:13.5px;line-height:1.55;white-space:pre}

/* kosong */
.empty{margin:auto;text-align:center;padding:30px 10px;max-width:640px}
.empty h1{font-size:clamp(28px,5vw,42px);font-weight:650;letter-spacing:-.025em;line-height:1.1}
.empty p{color:var(--ink-dim);margin:12px 0 26px;font-size:16px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.chip{
  font:inherit;text-align:left;color:var(--ink);cursor:pointer;padding:14px 16px;border-radius:16px;font-size:14.5px;line-height:1.4;
  background:var(--glass);border:1px solid rgba(255,255,255,.14);
}
.chip:hover{background:var(--glass-strong);border-color:rgba(255,255,255,.28)}

/* composer */
.composer{padding:8px 16px 16px;position:relative}
.attach{background:none;border:0;color:var(--ink-dim);cursor:pointer;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.attach:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.attach svg{width:20px;height:20px}
.chips{max-width:780px;margin:0 auto 8px;display:none;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:5px 6px 5px 11px;border-radius:999px;font-size:12.5px;background:var(--glass);border:1px solid var(--glass-edge)}
.fchip button{background:none;border:0;color:var(--ink-dim);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fchips span{padding:3px 10px;border-radius:999px;font-size:12px;background:rgba(255,255,255,.18)}
dialog#admDlg{width:min(720px,calc(100vw - 20px))}
.adm-new{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end;margin-bottom:6px}
.adm-new .field{margin-bottom:0}
.adm-err{min-height:18px;font-size:13px;color:var(--danger);margin:4px 0}
.adm-list{max-height:48vh;overflow-y:auto}
.adm-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13.5px}
.adm-row small{display:block;color:var(--ink-dim);margin-top:2px}
.adm-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.adm-ctl input{width:84px;padding:6px 9px;border-radius:9px;border:1px solid var(--glass-edge);background:rgba(8,11,24,.38);color:var(--ink);font:inherit;font-size:13px}
.mini{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:9px;border:1px solid var(--glass-edge);background:var(--glass);color:var(--ink);cursor:pointer}
.mini:hover{background:rgba(255,255,255,.2)}
.mini.del{color:var(--danger)}
@media (max-width:640px){.adm-new{grid-template-columns:1fr}}
.jump{position:absolute;right:16px;bottom:100%;margin-bottom:6px;display:none;flex-direction:column;gap:8px;z-index:5}
.jump.show{display:flex}
.jump button{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-edge);background:var(--glass-strong);color:var(--ink);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.jump button:hover{background:rgba(255,255,255,.28)}
.jump button:focus-visible{outline:2px solid var(--accent-2)}
.jump svg{width:18px;height:18px}
dialog#runDlg{width:min(960px,calc(100vw - 20px));max-width:none}
.run-panel{display:flex;flex-direction:column;height:min(78vh,720px);border-radius:var(--radius);overflow:hidden;background:linear-gradient(145deg,rgba(40,44,80,.9),rgba(22,25,50,.92));border:1px solid var(--glass-edge)}
.run-panel.full{position:fixed;inset:0;height:100%;border-radius:0;z-index:200}
.run-bar{display:flex;align-items:center;gap:4px;padding:8px 10px 8px 16px;font-size:13.5px;color:var(--ink-dim)}
.run-bar b{flex:1;color:var(--ink);font-weight:600}
.run-bar button{font:inherit;font-size:13px;color:var(--ink-dim);background:none;border:0;cursor:pointer;padding:6px 10px;border-radius:9px}
.run-bar button:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.run-panel iframe{flex:1;width:100%;border:0;background:#fff}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px;border-radius:20px;background:rgba(8,11,24,.38);border:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.box:focus-within{border-color:rgba(255,255,255,.4)}
textarea{
  flex:1;resize:none;border:0;background:none;color:var(--ink);font:inherit;font-size:15.5px;line-height:1.5;
  padding:9px 10px;max-height:200px;min-height:42px;outline:none;
}
textarea::placeholder{color:var(--ink-faint)}

<script>
(function(){
"use strict";
/* ---------- konfigurasi bawaan ---------- */
var DEFAULTS={
  baseUrl:"https://bandelbanget.xyz/v1",
  apiKey:"sk-qwen-02d12249413a6f0fd37dc6088c37c5eb4a027c632e806a57",
  system:"",
  temp:0.7,
  model:"glm-5.3"
};
/* Isi dengan data proyek Supabase Anda (Project Settings > API) */
var SUPA_URL="";   /* contoh: https://abcd1234.supabase.co */
var SUPA_KEY="";   /* anon public key */
var MODELS=["auto","glm-5.3","glm-5.3-flash","glm-5.3-flashx","glm-5.3-mod","deepseek-v4-flash","deepseek-v4-flash-0731","deepseek-v4-flash-vision-exp","deepseek-v4-pro-0813","deepseek-v4.1-flash","gpt-5.6","gpt-5.6-luna","kimi-k3","mimo-v2.5-pro","mimo-v2.6-flash","mimo-v2.6-pro"];
var SUGGEST=[
  "Jelaskan cara kerja blockchain dengan bahasa sederhana",
  "Buatkan fungsi JavaScript untuk debounce beserta contohnya",
  "Susun rencana belajar bahasa Inggris selama 30 hari",
  "Tulis email permintaan maaf karena balasan terlambat"
];
var ICON_SEND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
var ICON_STOP='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>';

/* ---------- penyimpanan ---------- */
function load(k,f){try{var v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var settings=Object.assign({},DEFAULTS,load("glassai.settings",{}));
var chats=load("glassai.chats",[]);
var activeId=load("glassai.active",null);
var busy=false,ctrl=null;

/* ---------- elemen ---------- */
var $=function(id){return document.getElementById(id)};
var feed=$("feed"),col=$("col"),input=$("input"),sendBtn=$("send"),hist=$("hist"),modelSel=$("model"),titleEl=$("chatTitle");
sendBtn.innerHTML=ICON_SEND;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function active(){return chats.find(function(c){return c.id===activeId})}
function persist(){save("glassai.chats",chats);save("glassai.active",activeId);save("glassai.settings",settings)}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ---------- markdown ringan ---------- */
function md(src){
  var blocks=[];
  var t=src.replace(/```([\w+-]*)[^\n]*\n?([\s\S]*?)(```|$)/g,function(m,l,c){blocks.push({l:l,c:c.replace(/\n$/,"")});return "\u0000"+(blocks.length-1)+"\u0000"});
  t=esc(t);
  t=t.replace(/`([^`\n]+)`/g,"<code>$1</code>")
     .replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")
     .replace(/(^|[^*])\*([^*\s][^*\n]*)\*/g,"$1<em>$2</em>")
     .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  var lines=t.split("\n"),out=[],para=[],list=null;
  function flushP(){if(para.length){out.push("<p>"+para.join("<br>")+"</p>");para=[]}}
  function flushL(){if(list){out.push("</"+list+">");list=null}}
  lines.forEach(function(ln){
    var m;
    if((m=ln.match(/^\u0000(\d+)\u0000$/))){
      flushP();flushL();var b=blocks[+m[1]];
      out.push('<div class="code"><div class="code-head"><span>'+(esc(b.l)||"kode")+'</span><button type="button" data-copy>Salin</button>'+(/^(html?|svg)$/i.test(b.l)?'<button type="button" data-run>Run</button>':"")+'</div><pre><code>'+esc(b.c)+"</code></pre></div>");
    }else if((m=ln.match(/^(#{1,4})\s+(.*)$/))){
      flushP();flushL();var n=m[1].length;out.push("<h"+n+">"+m[2]+"</h"+n+">");
    }else if((m=ln.match(/^\s*[-*•]\s+(.*)$/))){
      flushP();if(list!=="ul"){flushL();out.push("<ul>");list="ul"}out.push("<li>"+m[1]+"</li>");
    }else if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){
      flushP();if(list!=="ol"){flushL();out.push("<ol>");list="ol"}out.push("<li>"+m[1]+"</li>");
    }else if(!ln.trim()){
      flushP();flushL();
    }else{
      flushL();para.push(ln);
    }
  });
  flushP();flushL();
  return out.join("");
}

/* ---------- render ---------- */
function renderModels(){
  modelSel.innerHTML="";
  MODELS.forEach(function(m){var o=document.createElement("option");o.value=m;o.textContent=mlabel(m);modelSel.appendChild(o)});
  var c=active();modelSel.value=(c&&c.model)||settings.model;syncDD();
}
function renderHist(){
  hist.innerHTML="";
  if(chats.length){var l=document.createElement("div");l.className="hist-label";l.textContent="Riwayat";hist.appendChild(l)}
  chats.forEach(function(c){
    var d=document.createElement("div");d.className="item"+(c.id===activeId?" on":"");d.setAttribute("role","listitem");d.tabIndex=0;
    var s=document.createElement("span");s.textContent=c.title;
    var x=document.createElement("button");x.className="x";x.type="button";x.textContent="×";x.setAttribute("aria-label","Hapus obrolan "+c.title);
    x.onclick=function(e){e.stopPropagation();delChat(c.id)};
    d.onclick=function(){if(busy)return;activeId=c.id;persist();renderAll();closeSide()};
    d.onkeydown=function(e){if(e.key==="Enter"){d.click()}};
    d.appendChild(s);d.appendChild(x);hist.appendChild(d);
  });
}
function bubbleFor(m,isLast){
  var w=document.createElement("div");w.className="msg "+(m.role==="user"?"user":"bot");
  var b=document.createElement("div");b.className="bubble";
  if(m.role==="user"){b.textContent=m.files?(m.text||""):m.content;
    if(m.files&&m.files.length){var fc=document.createElement("div");fc.className="fchips";m.files.forEach(function(f){var t=document.createElement("span");t.textContent="📄 "+f.name;fc.appendChild(t)});b.appendChild(fc)}}
  else{
    if(m.error){b.classList.add("err");b.textContent=m.content}
    else if(!m.content){b.innerHTML='<span class="dots"><i></i><i></i><i></i></span>'}
    else{b.innerHTML=md(m.content)}
  }
  w.appendChild(b);
  if(m.role==="assistant"&&m.content&&!(busy&&isLast)){
    var t=document.createElement("div");t.className="tools";
    var cp=document.createElement("button");cp.className="tool";cp.type="button";cp.textContent="Salin";
    cp.onclick=function(){copy(m.content,cp)};t.appendChild(cp);
    if(isLast){var rg=document.createElement("button");rg.className="tool";rg.type="button";rg.textContent="Buat ulang";rg.onclick=regenerate;t.appendChild(rg)}
    w.appendChild(t);
  }
  return w;
}
function renderMsgs(){
  var c=active();col.innerHTML="";
  if(!c||!c.messages.length){
    var e=document.createElement("div");e.className="empty";
    e.innerHTML="<h1>Mau bahas apa hari ini?</h1><p>Pilih model di kanan atas, lalu mulai mengetik.</p>";
    var g=document.createElement("div");g.className="chips";
    SUGGEST.forEach(function(s){var b=document.createElement("button");b.className="chip";b.type="button";b.textContent=s;b.onclick=function(){send(s)};g.appendChild(b)});
    e.appendChild(g);col.appendChild(e);return;
  }
  c.messages.forEach(function(m,i){col.appendChild(bubbleFor(m,i===c.messages.length-1))});
}
function renderAll(){
  var c=active();
  titleEl.textContent=c?c.title:"Obrolan baru";
  renderModels();renderHist();renderMsgs();toBottom(true);
}
function toBottom(force){
  var near=feed.scrollHeight-feed.scrollTop-feed.clientHeight<140;
  if(force||near){feed.scrollTop=feed.scrollHeight}
}

/* ---------- aksi ---------- */
function newChat(){
  if(busy)return;
  var c=active();
  if(c&&!c.messages.length){input.focus();closeSide();return}
  c={id:uid(),title:"Obrolan baru",model:modelSel.value||settings.model,messages:[]};
  chats.unshift(c);activeId=c.id;persist();renderAll();closeSide();input.focus();
}
function delChat(id){
  if(busy)return;
  chats=chats.filter(function(c){return c.id!==id});
  if(activeId===id)activeId=chats.length?chats[0].id:null;
  persist();renderAll();
}
function copy(text,btn){
  function ok(){var o=btn.textContent;btn.textContent="Tersalin";setTimeout(function(){btn.textContent=o},1400)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback)}else fallback();
  function fallback(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(a)}
}
function setBusy(v){
  busy=v;sendBtn.innerHTML=v?ICON_STOP:ICON_SEND;
  sendBtn.setAttribute("aria-label",v?"Hentikan":"Kirim");
  sendBtn.disabled=false;
}
function friendlyError(err,status,body){
  if(err&&err.name==="AbortError")return null;
  if(status===401||status===403)return "API key ditolak. Periksa API key di Pengaturan.";
  if(status===429)return "Terlalu banyak permintaan atau kuota habis. Coba lagi nanti, atau isi ulang kuota di dattioai.com/akun.";
  if(status)return "Server mengembalikan error "+status+(body?": "+body.slice(0,300):"")+".";
  return "Tidak bisa terhubung ke server. Periksa koneksi internet dan Base URL di Pengaturan. Jika halaman ini dibuka dari file lokal dan tetap gagal, server mungkin memblokir akses browser (CORS).";
}
async function stream(c){
  var asst=c.messages[c.messages.length-1];
  var history=c.messages.slice(0,-1).map(function(m){return {role:m.role,content:m.content}});
  if(settings.system&&settings.system.trim())history.unshift({role:"system",content:settings.system.trim()});
  ctrl=new AbortController();
  var status=0,raw="";
  var pending=false,usageTok=null;
  function paint(){
    if(pending)return;pending=true;
    requestAnimationFrame(function(){
      pending=false;
      var bub=col.lastElementChild&&col.lastElementChild.querySelector(".bubble");
      if(bub&&!asst.error){bub.innerHTML=asst.content?md(asst.content):'<span class="dots"><i></i><i></i><i></i></span>'}
      toBottom(false);
    });
  }
  try{
    var res=await fetch(settings.baseUrl.replace(/\/+$/,"")+"/chat/completions",{
      method:"POST",signal:ctrl.signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+settings.apiKey},
      body:JSON.stringify({model:c.model||settings.model,messages:history,stream:true,temperature:Number(settings.temp)})
    });
    status=res.status;
    if(!res.ok){raw=await res.text().catch(function(){return ""});throw new Error("http")}
    var ctype=res.headers.get("content-type")||"";
    if(ctype.indexOf("text/event-stream")===-1&&ctype.indexOf("json")!==-1){
      var j=await res.json();if(j.usage&&j.usage.total_tokens)usageTok=j.usage.total_tokens;
      asst.content=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
      paint();
    }else{
      var reader=res.body.getReader(),dec=new TextDecoder(),buf="";
      while(true){
        var r=await reader.read();if(r.done)break;
        buf+=dec.decode(r.value,{stream:true});
        var parts=buf.split("\n");buf=parts.pop();
        for(var i=0;i<parts.length;i++){
          var line=parts[i].trim();
          if(line.indexOf("data:")!==0)continue;
          var data=line.slice(5).trim();
          if(!data||data==="[DONE]")continue;
          try{
            var obj=JSON.parse(data),ch=obj.choices&&obj.choices[0];
            if(obj.usage&&obj.usage.total_tokens)usageTok=obj.usage.total_tokens;
            var piece=ch&&ch.delta&&ch.delta.content;
            if(piece){asst.content+=piece;paint()}
          }catch(e){}
        }
      }

var qCard=$("qCard"),qNum=$("qNum"),qFill=$("qFill"),qMeta=$("qMeta"),qBar=$("qBar"),qRefresh=$("qRefresh");
var qLoading=false;
function nf(n){return Math.round(n).toLocaleString("id-ID")}
function short(n){
  var o={maximumFractionDigits:2};
  if(n>=1e9)return (n/1e9).toLocaleString("id-ID",o)+" M";
  if(n>=1e6)return (n/1e6).toLocaleString("id-ID",o)+" Jt";
  if(n>=1e4)return (n/1e3).toLocaleString("id-ID",{maximumFractionDigits:1})+" rb";
  return nf(n);
}
function walk(o,path,nums){
  if(o===null||o===undefined)return;
  if(typeof o==="number"&&isFinite(o)){nums.push([path,o]);return}
  if(typeof o==="string"){
    if(/^\d+(\.\d+)?$/.test(o.trim())){nums.push([path,parseFloat(o)])}
    else if(/expire|expiry|valid|until|berakhir|end/i.test(path)&&!isNaN(Date.parse(o))){nums.push([path,Date.parse(o)])}
    return;
  }
  if(typeof o==="object"){for(var k in o){walk(o[k],path?path+"."+k:k,nums)}}
}
function parseQuota(j){
  var nums=[];walk(j,"",nums);
  var expAt=null;
  nums.forEach(function(p){
    if(expAt===null&&/expire|expiry|valid|until|berakhir|end/i.test(p[0])){
      var v=p[1];
      if(v>1e12)expAt=v;else if(v>1e9)expAt=v*1000;
    }
  });
  function pick(re,ex){
    for(var i=0;i<nums.length;i++){
      var k=nums[i][0];
      if(re.test(k)&&!(ex&&ex.test(k))&&!/expire|expiry|valid|until|berakhir|end/i.test(k))return nums[i][1];
    }
    return null;
  }
  var remaining=pick(/remain|sisa|left|balance|available|saldo/i);
  var used=pick(/used|usage|consumed|spent|terpakai/i,/remain|left/i);
  var total=pick(/total|limit|quota|granted|allowance|cap|initial|purchase/i,/remain|left|used|usage|balance|sisa|percent|pct|multipl|rate/i);
  if(remaining===null&&used===null&&total!==null){remaining=total;total=null}
  if(remaining===null&&total!==null&&used!==null)remaining=Math.max(0,total-used);
  if(total===null&&remaining!==null&&used!==null)total=remaining+used;
  var pc=null;
  for(var i=0;i<nums.length;i++){if(/percent|pct|persen/i.test(nums[i][0])&&nums[i][1]>=0&&nums[i][1]<=100){pc=nums[i][1];break}}
  return {remaining:remaining,total:total,used:used,expAt:expAt,pc:pc};
}
function qMessage(text,bad){
  qCard.classList.remove("low","crit","unk");
  qNum.textContent="—";qFill.style.width="0%";qBar.removeAttribute("aria-valuenow");
  qMeta.innerHTML="";var s=document.createElement("span");if(bad)s.className="bad";s.textContent=text;qMeta.appendChild(s);
}
function showQuota(q){
  if(q.remaining===null){qMessage("Format data kuota tidak dikenali. Buka Pengaturan, tekan Cek kuota.",true);return}
  var pct=(q.total&&q.total>0)?Math.max(0,Math.min(100,q.remaining/q.total*100)):null;
  if(pct===null){
    /* total tidak dikirim API: pakai nilai tertinggi yang pernah terlihat sebagai 100% */
    var base=Math.max(+load("glassai.qbase",0)||0,q.remaining);save("glassai.qbase",base);
    if(base>0){pct=Math.min(100,q.remaining/base*100);q.total=base;q.est=true}
  }
  qNum.innerHTML="";
  qNum.appendChild(document.createTextNode(short(q.remaining)));
  var sm=document.createElement("small");sm.textContent="token";qNum.appendChild(sm);
  qNum.title=nf(q.remaining)+" token";
  qCard.classList.remove("low","crit","unk");
  if(pct===null){qCard.classList.add("unk");qFill.style.width="100%";qBar.removeAttribute("aria-valuenow")}
  else{
    qFill.style.width=pct.toFixed(1)+"%";qBar.setAttribute("aria-valuenow",Math.round(pct));
    if(pct<8)qCard.classList.add("crit");else if(pct<20)qCard.classList.add("low");
  }
  qMeta.innerHTML="";
  var l=document.createElement("span");
  l.textContent=pct===null?"Total paket tidak diketahui":((q.est?"dari ~":"dari ")+short(q.total)+" · "+(pct<10?pct.toFixed(1):Math.round(pct))+"%");
  qMeta.appendChild(l);
  if(q.expAt){
    var days=Math.ceil((q.expAt-Date.now())/864e5);
    var r=document.createElement("span");
    if(days<=0){r.className="bad";r.textContent="Masa aktif habis"}else{r.textContent=days+" hari lagi"}
    r.title="Aktif sampai "+new Date(q.expAt).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
    qMeta.appendChild(r);
  }
}
async function fetchQuota(){
  if(qLoading)return;
  if(session&&!session.admin)return acctQuota();
  if(!settings.apiKey){qMessage("Isi API key di Pengaturan.",true);return}
  qLoading=true;qRefresh.classList.add("spin");
  try{
    var r=await fetch(settings.baseUrl.replace(/\/+$/,"")+"/quota",{headers:{Authorization:"Bearer "+settings.apiKey}});
    if(r.status===401||r.status===403){qMessage("API key ditolak.",true)}
    else if(!r.ok){qMessage("Gagal memuat kuota (error "+r.status+").",true)}
    else{
      var j=await r.json();
      showQuota(parseQuota(j));
    }
  }catch(e){qMessage("Tidak bisa memuat kuota. Periksa koneksi.",true)}
  finally{qLoading=false;qRefresh.classList.remove("spin")}
}

    e.preventDefault();if(ddMenu.hidden)openDD();
    var it=[].slice.call(ddMenu.children),i=it.indexOf(document.activeElement);
    i=e.key==="ArrowDown"?Math.min(it.length-1,i+1):Math.max(0,i-1);it[i].focus();
  }
});

/* ---------- lampiran file ---------- */
var attach=[],fileIn=$("fileIn"),chips=$("chips");
function fsz(n){return n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB"}
function renderChips(){
  chips.innerHTML="";
  attach.forEach(function(f,i){
    var sp=document.createElement("span");sp.className="fchip";sp.textContent=f.name+" · "+fsz(f.size);
    var x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","Hapus "+f.name);
    x.onclick=function(){attach.splice(i,1);renderChips()};sp.appendChild(x);chips.appendChild(sp);
  });
  chips.style.display=attach.length?"flex":"none";
}
$("attachBtn").onclick=function(){fileIn.click()};
fileIn.onchange=async function(){
  var fl=Array.prototype.slice.call(fileIn.files);fileIn.value="";
  for(var i=0;i<fl.length;i++){
    var f=fl[i],txt;
    try{txt=await f.text()}catch(e){alert("Gagal membaca "+f.name);continue}
    if(txt.indexOf("\u0000")!==-1){alert(f.name+" bukan file teks, dilewati.");continue}
    var tk=Math.ceil(txt.length/3.5);
    if(f.size>100*1024){
      var sisa="";
      if(!confirm("File besar: "+f.name+" ("+fsz(f.size)+", sekitar "+nf(tk)+" token).\nIsinya dikirim utuh tanpa dipotong dan akan memakai banyak token"+sisa+".\n\nLanjutkan?"))continue;
    }
    attach.push({name:f.name,size:f.size,text:txt});
  }
  renderChips();
};

/* ---------- mulai ---------- */
if(activeId&&!active())activeId=null;
renderAll();
fetchQuota();
})();
</script>
</body>
</html>
