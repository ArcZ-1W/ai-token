<style>
:root{
  --bg:#f4f8ff;
  --card:rgba(255,255,255,.84);
  --soft:#eef3fc;
  --ink:#13264d;
  --mute:#5d7096;
  --acc:#2563eb;
  --line:rgba(24,42,88,.11);
  --sh:0 16px 44px rgba(20,50,115,.09),inset 0 1px 0 rgba(255,255,255,.92);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme=dark]{
  --bg:#0d1017;
  --card:rgba(22,25,34,.86);
  --soft:#1a1e29;
  --ink:#eef2fb;
  --mute:#94a0b8;
  --acc:#60a5fa;
  --line:rgba(255,255,255,.11);
  --sh:0 18px 46px rgba(0,0,0,.44);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font:15.5px/1.6 var(--font);
  color:var(--ink);
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  min-height:100svh;padding:24px 18px;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
.bg-glow{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(85% 48% at 50% 106%,rgba(37,99,235,.16),transparent 70%),
    radial-gradient(60% 40% at 15% 12%,rgba(56,189,248,.12),transparent 70%);
}
[data-theme=dark] .bg-glow{
  background:
    radial-gradient(85% 48% at 50% 106%,rgba(37,99,235,.26),transparent 70%),
    radial-gradient(60% 40% at 15% 12%,rgba(56,189,248,.10),transparent 70%);
}
.card{
  width:100%;max-width:460px;
  background:var(--card);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid var(--line);
  border-radius:28px;padding:36px 28px 32px;
  box-shadow:var(--sh);
  text-align:center;
  animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.orb{
  width:68px;height:68px;border-radius:20px;
  background:var(--soft);border:1px solid var(--line);
  display:grid;place-items:center;margin:0 auto 20px;
}
.orb img{height:38px;width:auto;display:block}
.code{
  font-size:clamp(54px,13vw,72px);font-weight:800;line-height:1;
  letter-spacing:-.045em;margin-bottom:10px;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 55%,#0284c7 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
[data-theme=dark] .code{
  background:linear-gradient(135deg,#e0edff 0%,#93c5fd 55%,#38bdf8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{font-size:clamp(22px,5vw,27px);font-weight:700;letter-spacing:-.025em;line-height:1.25}
.desc{color:var(--mute);font-size:15px;margin:10px auto 0;max-width:36ch}
.path-pill{
  display:inline-block;max-width:100%;margin-top:16px;
  padding:6px 13px;border-radius:10px;
  background:var(--soft);border:1px solid var(--line);
  font:13px var(--mono);color:var(--mute);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.dest-box{
  display:flex;align-items:center;gap:14px;text-align:left;
  margin:22px 0 6px;padding:14px 16px;border-radius:18px;
  background:var(--soft);border:1px solid var(--line);
  text-decoration:none;color:var(--ink);
  transition:border-color .18s,transform .18s,box-shadow .18s;
}
.dest-box:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));transform:translateY(-1.5px);box-shadow:0 8px 22px rgba(20,50,115,.08)}
.dest-box img{height:34px;width:auto;flex:none}
.dest-t{flex:1;min-width:0}
.dest-t b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.015em}
.dest-t small{display:block;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dest-arr{font-size:18px;color:var(--acc);font-weight:600;flex:none}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:44px;padding:0 20px;border-radius:999px;
  font:600 14.5px var(--font);text-decoration:none;cursor:pointer;
  border:1px solid var(--line);background:var(--soft);color:var(--ink);
  transition:transform .16s,opacity .16s,border-color .16s;
}
.btn:hover{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.pri{background:#2563eb;border-color:transparent;color:#fff}
.btn.pri:hover{opacity:.92;color:#fff}
.foot{margin-top:22px;font-size:12.5px;color:var(--mute)}
@media(prefers-reduced-motion:reduce){.card{animation:none}}

.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);margin-bottom:14px}
</style>
</head>
